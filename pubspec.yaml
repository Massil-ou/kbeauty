name: kbeauty
description: kBeauty - On-demand beauty services platform
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2

  # State Management & Reactive
  provider: ^6.0.0

  # Networking
  dio: ^5.0.0

  # Routing
  go_router: ^16.0.0

  # Local Storage
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.0.0

  # Firebase & Notifications
  firebase_core: ^2.24.0
  firebase_messaging: ^14.6.0

  # Payment
  stripe_flutter: ^10.0.0

  # Utilities
  uuid: ^4.0.0
  intl: ^0.19.0
  flutter_dotenv: ^5.1.0

  # UI
  flutter_svg: ^2.0.0
  image_picker: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - .env

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
